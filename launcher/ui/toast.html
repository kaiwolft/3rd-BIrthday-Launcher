<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logro</title>
<style>
@font-face{font-family:"T3B Type";src:url(fonts/SpecialElite-Regular.ttf) format("truetype")}
@font-face{font-family:"T3B Mono";src:url(fonts/ShareTechMono-Regular.ttf) format("truetype")}
@font-face{font-family:"T3B Sans";src:url(fonts/Barlow-Regular.ttf) format("truetype")}
:root{--red:#d3192c;--red-hi:#ff3346;--type:"T3B Type","Special Elite","Courier New",monospace;--mono:"T3B Mono","Share Tech Mono",Consolas,monospace;--sans:"T3B Sans","Barlow",Bahnschrift,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:transparent;user-select:none;cursor:none}
#card{position:absolute;left:50%;top:22px;width:540px;height:100px;display:flex;align-items:center;gap:20px;padding:0 24px 0 18px;
  transform:translate(-50%,-160%);opacity:0;background:linear-gradient(90deg,rgba(8,9,12,.97),rgba(16,17,21,.95) 60%,rgba(60,6,14,.95));
  border:1px solid rgba(255,255,255,.18);border-left:3px solid var(--red-hi);box-shadow:0 0 30px rgba(211,25,44,.3),0 18px 40px rgba(0,0,0,.6)}
#card.in{animation:drop .7s cubic-bezier(.2,.9,.25,1.12) forwards}
#card.out{animation:rise .55s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes drop{from{transform:translate(-50%,-160%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-160%);opacity:0}}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.sweep{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sweep i{position:absolute;inset:0;background:linear-gradient(100deg,transparent 38%,rgba(255,80,100,.3) 50%,transparent 62%);background-size:260% 100%;background-position:130% 0}
#card.in .sweep i{animation:sweep 1.4s .55s ease-in-out forwards}
@keyframes sweep{to{background-position:-130% 0}}
.badge{position:relative;flex:none;width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#6d0a15,#1a0205 72%);border:1px solid rgba(255,70,90,.6)}
.badge img{width:58px;filter:drop-shadow(0 0 6px rgba(255,40,60,.7))}
.badge img.ra{width:64px;height:64px;filter:none;box-shadow:0 0 10px rgba(255,40,60,.6)}
.badge .num{position:absolute;font-family:var(--type);font-size:24px;color:#fff;text-shadow:0 0 8px var(--red-hi)}
.ring{position:absolute;inset:-2px;border:2px solid rgba(255,90,110,.9);opacity:0}
#card.in .ring{animation:ring 1.1s .5s ease-out forwards}
@keyframes ring{0%{transform:scale(.8);opacity:.95}100%{transform:scale(1.6);opacity:0}}
.txt{flex:1;min-width:0}
.k{font-family:var(--mono);font-size:11.5px;letter-spacing:3px;color:var(--red-hi)}
.t{font-family:var(--type);font-size:21px;letter-spacing:2px;color:#f0eeea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0 2px}
.d{font-family:var(--sans);font-size:14px;color:#9a9ea4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="card">
  <div class="scan"></div><div class="sweep"><i></i></div>
  <div class="badge"><div class="ring"></div><img id="img" src="assets/emblem.png" alt=""><span class="num" id="num"></span></div>
  <div class="txt"><div class="k" id="k">LOGRO DESBLOQUEADO</div><div class="t" id="t"></div><div class="d" id="d"></div></div>
</div>
<script>
(() => {
  const host = window.ptHost;
  const $ = (id) => document.getElementById(id);
  const L = { es: 'LOGRO DESBLOQUEADO', en: 'ACHIEVEMENT UNLOCKED' };
  const chime = new Audio('assets/sfx/start.ogg');
  const card = $('card');
  if (host) host.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type !== 'show') return;
    const a = m.data || {};
    $('k').textContent = L[a.lang] || L.es;
    $('t').textContent = a.title || ''; $('d').textContent = a.description || '';
    $('num').textContent = a.mark || ''; $('img').style.opacity = a.mark ? '.35' : '1';
    $('img').src = a.badge || 'assets/emblem.png'; $('img').classList.toggle('ra', !!a.badge);
    $('k').textContent = (L[a.lang] || L.es) + (a.points ? '  ·  ' + a.points + ' PTS' : '');
    card.className = ''; void card.offsetWidth; card.className = 'in';
    if (a.sound !== false) { try { chime.currentTime = 0; chime.volume = .55; chime.play().catch(() => {}); } catch (e) {} }
    clearTimeout(card._t);
    card._t = setTimeout(() => { card.className = 'out'; setTimeout(() => host.postMessage(JSON.stringify({ cmd: 'toastDone' })), 600); }, 5200);
  });
})();
</script>
</body>
</html>
